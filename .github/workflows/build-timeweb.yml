# Собирает статику сайта и публикует её двумя путями:
#   1. выкладывает по FTP на виртуальный хостинг Timeweb — сайт обновляется сам;
#   2. кладёт banya-timeweb-production.zip в релиз timeweb-latest —
#      на случай ручной загрузки и как резервную копию сборки.
name: Timeweb production package

on:
  push:
    branches: [main]
  workflow_dispatch:

# Нужно для публикации релиза от имени GITHUB_TOKEN
permissions:
  contents: write

# Два деплоя одновременно затирали бы друг друга
concurrency:
  group: timeweb-deploy
  cancel-in-progress: false

env:
  # Боевой домен. Вшивается в canonical, Open Graph, JSON-LD, sitemap и robots
  # на этапе сборки, поэтому при смене домена меняется здесь и пересобирается.
  NEXT_PUBLIC_SITE_URL: https://баниумихалыча.рф
  # Ожидаемая ASCII-форма домена: код приводит кириллицу к punycode
  EXPECTED_HOST: xn--80aaab0bawfh5dya0a5c.xn--p1ai
  PACKAGE: banya-timeweb-production.zip
  RELEASE_TAG: timeweb-latest
  # Каталог публикации на хостинге. Если его не окажется, шаг «Detect FTP
  # directory» подберёт фактический и подставит его вместо этого значения.
  TARGET_DIR: /public_html/
  # Запасное имя FTP-сервера. Используется, только если значение секрета
  # FTP_SERVER не разрешается в адрес. Это не секрет, а публичное имя
  # сервера хостинга; логин и пароль по-прежнему берутся только из секретов.
  FTP_HOST_FALLBACK: vh470.timeweb.ru

jobs:
  build:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Check export
        run: |
          fail=0
          for f in index.html .htaccess robots.txt sitemap.xml 404.html; do
            if [ -f "out/$f" ]; then
              echo "ok   out/$f"
            else
              echo "::error::out/$f не создан"
              fail=1
            fi
          done
          if [ ! -d out/_next ]; then
            echo '::error::каталог out/_next не создан'
            fail=1
          fi
          exit $fail

      - name: Check domain in SEO files
        run: |
          fail=0
          for f in out/index.html out/robots.txt out/sitemap.xml; do
            if grep -q "$EXPECTED_HOST" "$f"; then
              echo "ok   $f — домен $EXPECTED_HOST"
            else
              echo "::error::$f не содержит $EXPECTED_HOST"
              fail=1
            fi
          done
          exit $fail

      - name: Drop media sources
        # hero.mp4 и hero.png лежат в public/ только как исходники для
        # scripts/prepare-hero-media.mjs. Сайт на них не ссылается, поэтому
        # ни на хостинг, ни в архив они не попадают. Если однажды на них
        # появится ссылка — шаг остановит сборку, а не молча их удалит.
        run: |
          for f in hero.mp4 hero.png; do
            if grep -rq "/$f" out --include='*.html' --include='*.js' --include='*.css' 2>/dev/null; then
              echo "::error::$f используется сайтом — удалять нельзя"
              exit 1
            fi
          done
          rm -f out/hero.mp4 out/hero.png
          echo "исходники media удалены из пакета"

      - name: Create ZIP
        # Архивируется содержимое out/, а не сам каталог: файлы обязаны
        # лежать в корне архива, без вложенной папки.
        run: |
          cd out
          zip -r -X "../$PACKAGE" . >/dev/null
          cd ..
          ls -lh "$PACKAGE"

      - name: Verify ZIP
        run: python3 .github/scripts/verify_zip.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Timeweb Production
          path: ${{ env.PACKAGE }}
          if-no-files-found: error
          retention-days: 90

      - name: Publish release timeweb-latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Релиз перевыпускается, чтобы тег указывал на свежую сборку,
          # а ссылка на скачивание оставалась неизменной.
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$RELEASE_TAG" "$PACKAGE" \
            --title "Timeweb Production" \
            --target "$GITHUB_SHA" \
            --notes-file .github/release-notes.md
          echo "релиз опубликован:"
          gh release view "$RELEASE_TAG" --json tagName,name,assets \
            --jq '{tag: .tagName, name: .name, assets: [.assets[].name]}'

      - name: Detect FTP directory
        # Чистит значения секретов от лишнего (ftp://, порт, пробелы) и
        # проверяет, что каталог публикации существует. Если его нет — ищет
        # фактический: у Timeweb сайт нередко лежит в <домен>/public_html.
        # Секреты нигде не печатаются.
        id: ftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 .github/scripts/detect_ftp_dir.py

      - name: Deploy to Timeweb over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          # Хост и логин берутся из предыдущего шага: там они очищены
          # от возможных ftp://, порта и пробелов. Пароль идёт из секрета как есть.
          server: ${{ steps.ftp.outputs.server }}
          username: ${{ steps.ftp.outputs.username }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          # Выкладывается только готовая статика: исходников, node_modules
          # и .git в этом каталоге нет по определению.
          local-dir: ./out/
          server-dir: ${{ steps.ftp.outputs.server_dir }}
          # Ничего лишнего с сервера не удаляем: действие синхронизирует
          # только то, что само туда клало.
          dangerous-clean-slate: false
          log-level: standard

      - name: Deploy summary
        run: |
          {
            echo "- выложено из \`./out/\` в \`${{ steps.ftp.outputs.server_dir }}\`"
            echo "- коммит: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "деплой завершён: ${{ steps.ftp.outputs.server_dir }}"
