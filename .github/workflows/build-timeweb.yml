# Собирает готовый к загрузке пакет статики для обычного хостинга Timeweb.
# Итог каждого запуска: banya-timeweb-production.zip — в артефактах запуска
# и в постоянном релизе timeweb-latest, откуда его можно скачать одной ссылкой.
name: Timeweb production package

on:
  push:
    branches: [main]
  workflow_dispatch:

# Нужно для публикации релиза от имени GITHUB_TOKEN
permissions:
  contents: write

# Параллельные сборки одного и того же релиза мешали бы друг другу
concurrency:
  group: timeweb-package
  cancel-in-progress: true

env:
  # Боевой домен. Вшивается в canonical, Open Graph, JSON-LD, sitemap и robots
  # на этапе сборки, поэтому при смене домена меняется здесь и пересобирается.
  NEXT_PUBLIC_SITE_URL: https://баниумихалыча.рф
  # Ожидаемая ASCII-форма домена: код приводит кириллицу к punycode
  EXPECTED_HOST: xn--80aaab0bawfh5dya0a5c.xn--p1ai
  PACKAGE: banya-timeweb-production.zip
  RELEASE_TAG: timeweb-latest

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Check export
        run: |
          test -f out/index.html || { echo '::error::out/index.html не создан'; exit 1; }
          test -f out/.htaccess  || { echo '::error::out/.htaccess не создан'; exit 1; }
          echo "out/index.html и out/.htaccess на месте"

      - name: Check domain in SEO files
        run: |
          fail=0
          for f in out/index.html out/robots.txt out/sitemap.xml; do
            if grep -q "$EXPECTED_HOST" "$f"; then
              echo "ok   $f — домен $EXPECTED_HOST"
            else
              echo "::error::$f не содержит $EXPECTED_HOST"
              fail=1
            fi
          done
          exit $fail

      - name: Drop media sources
        # hero.mp4 и hero.png лежат в public/ только как исходники для
        # scripts/prepare-hero-media.mjs. Сайт на них не ссылается —
        # в пакет для хостинга они не нужны.
        run: |
          rm -f out/hero.mp4 out/hero.png
          echo "исходники media удалены из пакета"

      - name: Create ZIP
        # Архивируется содержимое out/, а не сам каталог: точки монтирования
        # внутри архива быть не должно, файлы обязаны лежать в корне.
        run: |
          cd out
          zip -r -X "../$PACKAGE" . >/dev/null
          cd ..
          ls -lh "$PACKAGE"

      - name: Verify ZIP
        run: |
          python3 - <<'PY'
          import os, sys, zipfile

          package = os.environ['PACKAGE']
          names = zipfile.ZipFile(package).namelist()
          errors = []

          # 1. Никакой вложенной папки в корне архива
          for bad in ('out/', 'banya-timeweb-production/', './'):
              nested = [n for n in names if n.startswith(bad)]
              if nested:
                  errors.append(f'в архиве есть вложенный префикс {bad!r}: {nested[:3]}')

          # 2. Обязательные файлы — непосредственно в корне
          for required in ('index.html', '.htaccess', '404.html',
                           'robots.txt', 'sitemap.xml'):
              if required not in names:
                  errors.append(f'в корне архива нет {required}')

          # 3. Каталог сборки Next.js на месте
          if not any(n.startswith('_next/') for n in names):
              errors.append('в архиве нет каталога _next/')

          # 4. Исходников быть не должно
          for src in ('app/', 'components/', 'lib/', 'node_modules/',
                      '.next/', 'scripts/', 'reference/'):
              if any(n.startswith(src) for n in names):
                  errors.append(f'в архиве найдены исходники {src}')
          for src in ('package.json', 'package-lock.json', 'tsconfig.json',
                      'next.config.mjs', '.env', '.env.example'):
              if src in names:
                  errors.append(f'в архиве найден исходный файл {src}')

          # 5. Исходники media не попали
          for src in ('hero.mp4', 'hero.png'):
              if src in names:
                  errors.append(f'в архиве остался исходник {src}')

          if errors:
              for e in errors:
                  print(f'::error::{e}')
              sys.exit(1)

          print(f'файлов в архиве: {len(names)}')
          print('в корне архива:')
          for r in sorted({n.split("/")[0] for n in names}):
              print('   ', r)
          print('проверки пройдены')
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Timeweb Production
          path: ${{ env.PACKAGE }}
          if-no-files-found: error
          retention-days: 90

      - name: Publish release timeweb-latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Релиз перевыпускается, чтобы тег всегда указывал на свежую сборку,
          # а ссылка на скачивание оставалась неизменной.
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag 2>/dev/null || true

          gh release create "$RELEASE_TAG" "$PACKAGE" \
            --title "Timeweb Production" \
            --target "$GITHUB_SHA" \
            --notes "Готовый статический сайт для обычного хостинга Timeweb.

          Домен сборки: https://баниумихалыча.рф

          Как публиковать:
          1. Скачать \`$PACKAGE\`.
          2. Распаковать содержимое **непосредственно** в \`public_html\`
             так, чтобы \`index.html\` лежал в корне \`public_html\`.
          3. Готово — Node.js и npm на хостинге не нужны.

          Скрытый файл \`.htaccess\` тоже нужно загрузить: в нём редиректы,
          MIME-типы, сжатие и кеширование.

          Собрано из коммита $GITHUB_SHA."

          echo "релиз опубликован:"
          gh release view "$RELEASE_TAG" --json tagName,name,assets \
            --jq '{tag: .tagName, name: .name, assets: [.assets[].name]}'
