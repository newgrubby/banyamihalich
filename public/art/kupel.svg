<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 640" width="600" height="640" role="img" aria-label="Небольшая деревянная купель с холодной водой и поручнем">
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#1d1510"/>
      <stop offset="55%" stop-color="#120d0a"/>
      <stop offset="100%" stop-color="#080605"/>
    </linearGradient>

    <linearGradient id="woodSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e1209"/>
      <stop offset="30%" stop-color="#563318"/>
      <stop offset="62%" stop-color="#8a5527"/>
      <stop offset="100%" stop-color="#2a1a0e"/>
    </linearGradient>

    <linearGradient id="woodTop" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#6b4222"/>
      <stop offset="48%" stop-color="#9a6330"/>
      <stop offset="100%" stop-color="#3d2513"/>
    </linearGradient>

    <linearGradient id="waterG" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#16282c"/>
      <stop offset="45%" stop-color="#0d1a1e"/>
      <stop offset="100%" stop-color="#070e11"/>
    </linearGradient>

    <radialGradient id="waterLight" cx="0.62" cy="0.28" r="0.6">
      <stop offset="0%" stop-color="#9ab0ae" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#4a6668" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="warm" cx="0.78" cy="0.12" r="0.7">
      <stop offset="0%" stop-color="#dc9147" stop-opacity="0.34"/>
      <stop offset="60%" stop-color="#7a3f18" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0%" stop-color="#4c4741"/>
      <stop offset="35%" stop-color="#b4ada2"/>
      <stop offset="60%" stop-color="#6d675e"/>
      <stop offset="100%" stop-color="#2c2823"/>
    </linearGradient>

    <linearGradient id="vign" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0.58"/>
      <stop offset="32%" stop-color="#000" stop-opacity="0"/>
      <stop offset="70%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="grain" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.01 0.18" numOctaves="4" seed="3"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
    </filter>

    <filter id="ripple" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.09" numOctaves="3" seed="8" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="9" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <clipPath id="waterClip">
      <ellipse cx="300" cy="323" rx="142" ry="26"/>
    </clipPath>
  </defs>

  <rect width="600" height="640" fill="url(#room)"/>

  <!-- стена из досок -->
  <g opacity="0.55">
    <g stroke="#2c1d13" stroke-width="2">
      <path d="M0 96h600M0 192h600M0 288h600"/>
      <path d="M96 0v300M240 0v300M384 0v300M528 0v300" opacity="0.5"/>
    </g>
  </g>
  <rect width="600" height="330" filter="url(#grain)" opacity="0.16" style="mix-blend-mode:overlay"/>
  <rect width="600" height="640" fill="url(#warm)"/>

  <!-- пол -->
  <rect y="470" width="600" height="170" fill="#150e09"/>
  <g stroke="#0a0705" stroke-width="2.5" opacity="0.75">
    <path d="M-60 494 L-160 640"/><path d="M120 494 L70 640"/><path d="M300 494 v146"/>
    <path d="M480 494 L530 640"/><path d="M660 494 L760 640"/>
  </g>
  <path d="M0 486h600" stroke="#3a2517" stroke-width="2" opacity="0.5"/>

  <!-- тень купели -->
  <ellipse cx="300" cy="512" rx="215" ry="34" fill="#050403" opacity="0.8"/>

  <!-- купель: корпус -->
  <g>
    <!-- боковая стенка -->
    <path d="M138 318 C136 380 152 448 172 494 A128 20 0 0 0 428 494 C448 448 464 380 462 318 Z" fill="url(#woodSide)"/>
    <path d="M138 318 C136 380 152 448 172 494 A128 20 0 0 0 428 494 C448 448 464 380 462 318 Z" filter="url(#grain)" opacity="0.2" style="mix-blend-mode:overlay"/>

    <!-- вертикальные доски -->
    <g stroke="#160d07" stroke-width="2" opacity="0.8">
      <path d="M178 336 l-8 158"/><path d="M218 344 l-6 154"/><path d="M258 348 l-4 152"/>
      <path d="M300 350 l0 152"/><path d="M342 348 l4 152"/><path d="M382 344 l6 154"/>
      <path d="M422 336 l8 158"/>
    </g>

    <!-- обручи -->
    <g fill="none">
      <path d="M146 372 A154 30 0 0 0 454 372" stroke="#171009" stroke-width="16"/>
      <path d="M146 366 A154 30 0 0 0 454 366" stroke="#7d5a33" stroke-width="2.6" opacity="0.55"/>
      <path d="M160 452 A140 26 0 0 0 440 452" stroke="#171009" stroke-width="14"/>
      <path d="M160 447 A140 26 0 0 0 440 447" stroke="#7d5a33" stroke-width="2.4" opacity="0.5"/>
    </g>

    <!-- верхняя кромка -->
    <ellipse cx="300" cy="318" rx="162" ry="34" fill="url(#woodTop)"/>
    <ellipse cx="300" cy="318" rx="162" ry="34" fill="none" stroke="#20130a" stroke-width="2"/>
    <ellipse cx="300" cy="321" rx="146" ry="27" fill="url(#innerWall)"/>

    <!-- вода -->
    <g clip-path="url(#waterClip)">
      <ellipse cx="300" cy="326" rx="140" ry="25" fill="url(#waterG)"/>
      <g filter="url(#ripple)" opacity="0.9">
        <ellipse cx="300" cy="326" rx="140" ry="25" fill="url(#waterLight)"/>
        <g stroke="#a9bfbb" stroke-width="1.6" fill="none" opacity="0.22">
          <path d="M186 322 q38 -7 76 0 t76 0 t76 0"/>
          <path d="M190 334 q38 -7 76 0 t76 0 t76 0"/>
        </g>
      </g>
      <ellipse cx="346" cy="318" rx="62" ry="12" fill="#e8dcc6" opacity="0.14"/>
    </g>

    <!-- блик на кромке -->
    <path d="M170 300 A162 34 0 0 1 420 296" fill="none" stroke="#d09a56" stroke-width="2.4" opacity="0.4" stroke-linecap="round"/>

    <!-- ступень -->
    <g>
      <path d="M86 496 h150 v24 h-156 Z" fill="#4a2e17" stroke="#160d07" stroke-width="2"/>
      <path d="M86 496 h150 l-6 -12 h-138 Z" fill="#6b4322"/>
    </g>
  </g>

  <!-- поручень -->
  <g fill="none" stroke="#000" stroke-width="13" stroke-linecap="round" opacity="0.35">
    <path d="M492 476 V318 q0 -36 -36 -36 h-30"/>
  </g>
  <g fill="none" stroke="url(#steel)" stroke-width="11" stroke-linecap="round">
    <path d="M488 472 V314 q0 -36 -36 -36 h-30"/>
  </g>
  <g fill="#2a251f" stroke="#6d675e" stroke-width="2">
    <rect x="474" y="468" width="30" height="16" rx="3"/>
  </g>

  <!-- ковш на кромке -->
  <g transform="translate(188 300) rotate(-8) scale(0.9)">
    <ellipse cx="0" cy="0" rx="34" ry="12" fill="#3a2413" stroke="#7d5024" stroke-width="2"/>
    <path d="M-34 0 q0 26 34 26 q34 0 34 -26" fill="#4d3018" stroke="#22150a" stroke-width="2"/>
    <path d="M30 -4 q30 -14 44 -34" stroke="#7d5024" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>

  <!-- капли на полу -->
  <g fill="#4e7d8a" opacity="0.35">
    <ellipse cx="180" cy="540" rx="16" ry="5"/>
    <ellipse cx="240" cy="558" rx="10" ry="3.5"/>
    <ellipse cx="410" cy="546" rx="13" ry="4"/>
  </g>

  <rect width="600" height="640" fill="url(#vign)"/>
</svg>
